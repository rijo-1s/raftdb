[package]
name = "raftdb"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "raftdb"
path = "src/main.rs"

[dependencies]
raftdb-log = { path = "../raftdb-log" }
raft-core = { path = "../raft-core" }
storage = { path = "../storage" }
kv = { path = "../kv" }
raftdb-proto = { path = "../raftdb-proto" }
tokio = { version = "1", features = ["full"] }
libc = "0.2"
rustls-pemfile = "2"
tokio-rustls = "0.25"
rustls = "0.22"
tonic = { version = "0.11", features = ["tls"] }
ring = "0.17"
tower-layer = "0.3"
clap = { version = "=4.4.18", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.8.1"
rcgen = "=0.12.1"
base64 = "0.22"
